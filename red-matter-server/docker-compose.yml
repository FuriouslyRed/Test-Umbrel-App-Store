version: "3.7"

services:
  server:
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    restart: on-failure
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - type: bind
        source: ${APP_DATA_DIR}/data
        target: /data
        read_only: false
        bind:
          create_host_path: true
      - /run/dbus:/run/dbus:ro